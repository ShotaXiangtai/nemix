name: F-Droid repository

# Builds the signed index of the self-hosted F-Droid repository at
# https://nemi-x.com/fdroid/repo from the APKs attached to GitHub Releases.
#
# - The index (index-v1.jar, index-v2.json, entry.jar, icons, screenshots) is
#   committed to website/fdroid/repo and deployed by Cloudflare with the site.
# - APK files are NOT stored on Cloudflare (25 MiB asset limit). website/_redirects
#   sends /fdroid/repo/<file>.apk to the matching GitHub Release asset; F-Droid
#   verifies every download against the SHA-256 recorded in the signed index.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Install fdroidserver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver
          fdroid --version

      - name: Prepare repository workspace
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FDROID_REPO_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret FDROID_REPO_KEYSTORE_BASE64 is not set. See docs/FDROID.md."
            exit 1
          fi
          W="$RUNNER_TEMP/fdroid"
          mkdir -p "$W/metadata" "$W/repo/icons"
          cp fdroid/config.yml "$W/config.yml"
          chmod 600 "$W/config.yml"
          cp fdroid/metadata/im.nemix.android.yml "$W/metadata/"
          # Store listing (descriptions, icon, screenshots) from the app's fastlane metadata
          cp -r bitchat-android/fastlane/metadata/android "$W/metadata/im.nemix.android"
          cp website/assets/nemix-logo.png "$W/repo/icons/icon.png"
          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 -d > "$W/keystore.p12"
          echo "W=$W" >> "$GITHUB_ENV"

      - name: Download release APKs (latest 3 releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/redirects.txt"
          for TAG in $(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 3 --json tagName -q '.[].tagName'); do
            FILE="nemix-${TAG}.apk"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p nemix-android-universal.apk -O "$W/repo/$FILE" || continue
            echo "/fdroid/repo/$FILE https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/nemix-android-universal.apk 302" >> "$RUNNER_TEMP/redirects.txt"
          done
          ls -la "$W/repo"
          cat "$RUNNER_TEMP/redirects.txt"

      - name: Build and sign index
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
        run: |
          cd "$W"
          fdroid update --verbose
          rm -f keystore.p12
          ls -la repo

      - name: Publish index to website/
        run: |
          rm -rf website/fdroid/repo
          mkdir -p website/fdroid/repo
          (cd "$W/repo" && find . -type f ! -name '*.apk' ! -name '*.apk.asc' ! -name '*.idsig' -print0 \
            | xargs -0 -I{} cp --parents {} "$GITHUB_WORKSPACE/website/fdroid/repo/")
          {
            echo "# BEGIN F-Droid APK redirects (generated by .github/workflows/fdroid-repo.yml)"
            cat "$RUNNER_TEMP/redirects.txt"
            echo "# END F-Droid APK redirects"
          } > "$RUNNER_TEMP/block.txt"
          touch website/_redirects
          sed -i '/^# BEGIN F-Droid APK redirects/,/^# END F-Droid APK redirects/d' website/_redirects
          cat "$RUNNER_TEMP/block.txt" >> website/_redirects
          git add website/fdroid/repo website/_redirects
          if git diff --cached --quiet; then
            echo "No changes to the F-Droid index."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update F-Droid repository index"
          git push origin HEAD:main
