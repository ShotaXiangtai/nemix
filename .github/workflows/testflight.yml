name: iOS TestFlight

# Manually triggered. Archives the iOS app on a macOS runner and uploads it to
# App Store Connect / TestFlight. No local Mac is needed: signing certificates
# and provisioning profiles are created and managed by Apple (cloud signing)
# through an App Store Connect API key with the Admin role.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    defaults:
      run:
        working-directory: nemix-ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set. See docs/STORE_RELEASE.md."; exit 1; fi
          done

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      # Fails fast with a readable reason if the API key is wrong. Never prints secret values.
      - name: Verify App Store Connect access
        run: |
          echo "Key ID format ok:    $([[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] && echo yes || echo NO - expected 10 uppercase letters/digits)"
          echo "Issuer ID format ok: $([[ "$ASC_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] && echo yes || echo NO - expected a lowercase UUID)"
          echo "Team ID format ok:   $([[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] && echo yes || echo NO - expected 10 uppercase letters/digits)"
          echo "Key file looks ok:   $(grep -q 'BEGIN PRIVATE KEY' "$ASC_KEY_PATH" && echo yes || echo NO - missing BEGIN PRIVATE KEY)"
          node - <<'JS'
          const crypto = require("crypto"), fs = require("fs");
          const b64u = (b) => Buffer.from(b).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const header = b64u(JSON.stringify({ alg: "ES256", kid: process.env.ASC_KEY_ID, typ: "JWT" }));
          const claims = b64u(JSON.stringify({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 600, aud: "appstoreconnect-v1" }));
          const sig = crypto.sign("sha256", Buffer.from(header + "." + claims),
            { key: fs.readFileSync(process.env.ASC_KEY_PATH), dsaEncoding: "ieee-p1363" });
          const jwt = header + "." + claims + "." + b64u(sig);
          (async () => {
            const res = await fetch("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=im.nemix.ios",
              { headers: { Authorization: "Bearer " + jwt } });
            const body = await res.json().catch(() => ({}));
            console.log("App Store Connect API status:", res.status);
            if (!res.ok) {
              for (const e of body.errors || []) console.log("  ", e.code, "-", e.title, "-", e.detail);
              console.log("::error::App Store Connect API key was rejected (HTTP " + res.status + "). See the lines above.");
              process.exit(1);
            }
            const n = (body.data || []).length;
            console.log("App record for im.nemix.ios found:", n > 0 ? "yes" : "NO - create the app in App Store Connect first");
            if (n === 0) {
              const all = await (await fetch("https://api.appstoreconnect.apple.com/v1/apps?limit=50&fields[apps]=name,bundleId",
                { headers: { Authorization: "Bearer " + jwt } })).json().catch(() => ({}));
              const apps = all.data || [];
              console.log("Apps in this App Store Connect account:", apps.length);
              for (const a of apps) console.log("   -", a.attributes.name, "/", a.attributes.bundleId);
              process.exit(1);
            }
          })();
          JS

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Archive unsigned; the export step signs with an Apple-managed distribution
      # certificate, so no registered device or local certificate is needed.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Nemix.xcodeproj -scheme Nemix -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nemix.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nemix.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          # altool looks for the key as ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          grep -qiE "No errors uploading|UPLOAD SUCCEEDED" upload.log

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/*.p8

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: nemix-ios/*.log
          retention-days: 7
