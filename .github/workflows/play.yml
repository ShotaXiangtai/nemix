name: Google Play

# Manually triggered. Builds a signed AAB and uploads it to the selected Play track.
# The very first AAB for a new app must be uploaded by hand in Play Console
# (download the "nemix-android-aab" artifact from this workflow with upload=false).

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      upload:
        description: "Upload to Play (false = only build the AAB artifact)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bitchat-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Restore upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is not set. See docs/STORE_RELEASE.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)
          echo "BITCHAT_GITHUB_RELEASE_CERT_SHA256=$FP" >> "$GITHUB_ENV"

      # Google Play ships the play flavor (Google ML Kit + Play Services location).
      - name: Build AAB
        run: ./gradlew :app:bundlePlayRelease --stacktrace

      - name: Sign AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -signedjar "$RUNNER_TEMP/nemix-android.aab" "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/nemix-android.aab" | tail -1
          rm -f "$RUNNER_TEMP/release.jks"
          cp "$RUNNER_TEMP/nemix-android.aab" app/build/nemix-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: nemix-android-aab
          path: |
            bitchat-android/app/build/nemix-android.aab
            bitchat-android/app/build/outputs/mapping/playRelease/mapping.txt
          retention-days: 30

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: im.nemix.android
          releaseFiles: bitchat-android/app/build/nemix-android.aab
          mappingFile: bitchat-android/app/build/outputs/mapping/playRelease/mapping.txt
          track: ${{ inputs.track }}
          status: completed
