# fdroidserver configuration for the self-hosted nemix F-Droid repository.
# Used by .github/workflows/fdroid-repo.yml. Secrets come from the environment.
repo_url: https://nemi-x.com/fdroid/repo
repo_name: nemix
repo_icon: icon.png
repo_description: >-
  Official F-Droid repository of nemix, a serverless P2P end-to-end encrypted
  messenger. Contains the privacy edition (no Google libraries). Source code:
  https://github.com/ShotaXiangtai/nemix

archive_older: 0

repo_keyalias: nemix-repo
keystore: keystore.p12
keystorepass:
  env: FDROID_KEYSTORE_PASS
keypass:
  env: FDROID_KEYSTORE_PASS
keydname: CN=nemix, O=nemix
