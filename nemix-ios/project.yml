# XcodeGen project definition. The Xcode project is generated from this file
# (CI does it automatically). On a Mac:  brew install xcodegen && xcodegen generate
name: Nemix
options:
  bundleIdPrefix: im.nemix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Nemix:
    type: application
    platform: iOS
    sources:
      - path: Nemix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.nemix.ios
        PRODUCT_NAME: Nemix
        INFOPLIST_FILE: Nemix/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # Set in CI from the APPLE_TEAM_ID secret when signing for TestFlight.
        DEVELOPMENT_TEAM: ""
schemes:
  Nemix:
    build:
      targets:
        Nemix: all
    run:
      config: Debug
    archive:
      config: Release
