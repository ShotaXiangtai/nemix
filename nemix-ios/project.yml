# XcodeGen project definition for nemix iOS.
# The Xcode project is generated from this file (CI does it automatically).
# On a Mac:  brew install xcodegen && xcodegen generate
#
# Sources in bitchat/ and localPackages/ come from the upstream bitchat iOS app
# (public domain, https://github.com/permissionlesstech/bitchat), which is
# protocol-compatible with the Android app. iOS only: no macOS target.
name: Nemix
options:
  bundleIdPrefix: im.nemix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig
packages:
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.24.0
  BitFoundation:
    path: localPackages/BitFoundation
  BitLogger:
    path: localPackages/BitLogger
  Tor:
    path: localPackages/Arti
targets:
  Nemix:
    type: application
    platform: iOS
    sources:
      - path: bitchat
    dependencies:
      - package: swift-secp256k1
        product: P256K
      - package: BitFoundation
      - package: BitLogger
      - package: Tor
    settings:
      base:
        PRODUCT_NAME: Nemix
        INFOPLIST_FILE: bitchat/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        DEVELOPMENT_ASSET_PATHS: bitchat/_PreviewHelpers
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Set in CI from the APPLE_TEAM_ID secret when signing for TestFlight.
        DEVELOPMENT_TEAM: ""
schemes:
  Nemix:
    build:
      targets:
        Nemix: all
    run:
      config: Debug
    archive:
      config: Release
